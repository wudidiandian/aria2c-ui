<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria2c 下载器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      <span>下载器</span>
    </div>

    <div class="conn" id="connStatus">
      <span class="dot" id="connDot"></span>
      <span id="connText">连接中…</span>
    </div>

    <div class="global-speed" id="globalSpeed" title="总下载速度">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 17V3m0 14l-5-5m5 5l5-5"/>
      </svg>
      <span id="speedText">0 B/s</span>
    </div>

    <div class="topbar-actions">
      <button class="btn ghost" id="btnResumeAll" title="继续全部">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/></svg>
        全部继续
      </button>
      <button class="btn ghost" id="btnPauseAll" title="暂停全部">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="5" y="4" width="4" height="16" rx="1"/><rect x="15" y="4" width="4" height="16" rx="1"/></svg>
        全部暂停
      </button>
      <button class="btn ghost" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V22a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.88.34H10a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88V10a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.54 1z"/>
        </svg>
        设置
      </button>
      <button class="btn primary" id="btnNewTask">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        新建任务
      </button>
    </div>
  </header>

  <div class="offline-banner" id="offlineBanner" hidden>
    <span id="offlineText">aria2c 未连接，正在重试…</span>
  </div>

  <nav class="filters" id="filters">
    <button class="filter active" data-filter="all">全部 <span class="count" data-count="all">0</span></button>
    <button class="filter" data-filter="active">下载中 <span class="count" data-count="active">0</span></button>
    <button class="filter" data-filter="waiting">等待中 <span class="count" data-count="waiting">0</span></button>
    <button class="filter" data-filter="paused">已暂停 <span class="count" data-count="paused">0</span></button>
    <button class="filter" data-filter="complete">已完成 <span class="count" data-count="complete">0</span></button>
    <button class="filter" data-filter="error">出错 <span class="count" data-count="error">0</span></button>
  </nav>

  <main class="task-list" id="taskList"></main>

  <div class="empty" id="emptyState" hidden>
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg>
    <p>暂无下载任务</p>
    <button class="btn primary" id="btnEmptyNew">新建下载任务</button>
  </div>

  <!-- 新建任务 -->
  <div class="modal-mask hidden" id="newTaskModal">
    <div class="modal">
      <div class="modal-head">
        <h3>新建下载任务</h3>
        <button class="icon-btn" data-close="newTaskModal">✕</button>
      </div>
      <div class="form">
        <label>下载链接（每行一个，每个链接创建一个独立任务）</label>
        <textarea id="taskUrls" rows="5" placeholder="每行一个链接，每行将创建为独立任务&#10;https://example.com/file.zip&#10;magnet:?xt=urn:btih:...（支持磁力/BT）"></textarea>

        <label>保存目录</label>
        <div class="row">
          <input type="text" id="taskSaveDir" readonly placeholder="使用默认目录">
          <button class="btn ghost" id="btnChooseDir">选择</button>
        </div>

        <div class="field-row">
          <div class="field">
            <label>连接数</label>
            <div class="stepper">
              <button type="button" data-step="connections" data-delta="-1">−</button>
              <input type="number" id="taskConnections" min="1" max="16" value="16">
              <button type="button" data-step="connections" data-delta="1">+</button>
            </div>
          </div>
          <div class="field">
            <label>分片数</label>
            <div class="stepper">
              <button type="button" data-step="splits" data-delta="-1">−</button>
              <input type="number" id="taskSplits" min="1" max="16" value="16">
              <button type="button" data-step="splits" data-delta="1">+</button>
            </div>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>单任务限速（可选，如 10M / 500K）</label>
            <input type="text" id="taskMaxSpeed" placeholder="不限速">
          </div>
          <div class="field" id="filenameField">
            <label>文件名（仅单链接时可指定）</label>
            <input type="text" id="taskFilename" placeholder="自动识别">
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close="newTaskModal">取消</button>
        <button class="btn primary" id="btnSubmitTask">创建任务</button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="modal-mask hidden" id="settingsModal">
    <div class="modal">
      <div class="modal-head">
        <h3>设置</h3>
        <button class="icon-btn" data-close="settingsModal">✕</button>
      </div>
      <div class="form">
        <div class="field">
          <label>默认下载目录</label>
          <div class="dir-row">
            <input type="text" id="cfgDownloadDir" readonly>
            <button class="btn ghost" id="btnCfgBrowse">浏览</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>默认连接数 (1-16)</label>
            <input type="number" id="cfgConnections" min="1" max="16">
          </div>
          <div class="field">
            <label>默认分片数 (1-16)</label>
            <input type="number" id="cfgSplits" min="1" max="16">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>同时下载任务数 (1-20)</label>
            <input type="number" id="cfgConcurrent" min="1" max="20">
          </div>
          <div class="field">
            <label>全局限速（如 10M，留空不限）</label>
            <input type="text" id="cfgLimit" placeholder="不限速">
          </div>
        </div>
        <p class="hint">提示：RPC 端口等高级配置请编辑 %APPDATA%\Aria2cUI\config.json（重启后生效）</p>
      </div>
      <div class="modal-actions">
        <span class="app-version" id="appVersion"></span>
        <button class="btn primary" id="btnSaveConfig">保存</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="js/app.js"></script>
</body>
</html>
